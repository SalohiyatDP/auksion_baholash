# ============================================================
# YerAuksion — Ishlab chiqarish (production) tarkibi
# narx.namresort.uz domeni uchun Caddy (avtomatik HTTPS) + Next.js + PostgreSQL
# Ishga tushirish:  docker compose -f docker-compose.prod.yml up -d --build
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: yerauksion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    # Xavfsizlik: bazani tashqariga ochmaymiz (faqat ichki tarmoq)

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yerauksion-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_DIR: "/app/storage"
      NEXT_PUBLIC_APP_URL: "https://narx.namresort.uz"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD}
      NODE_ENV: "production"
    volumes:
      - storage:/app/storage
    expose:
      - "3000" # faqat ichki tarmoq; tashqariga Caddy chiqaradi

  caddy:
    image: caddy:2-alpine
    container_name: yerauksion-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
