# YerAuksion — lokal ishga tushirish (SQLite, alohida DB serveri kerak emas)
# Ishga tushirish:  docker compose up --build   ->  http://localhost:3000
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yerauksion-app
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      JWT_SECRET: "docker-demo-secret-change-in-production-1234567890"
      STORAGE_DIR: "/app/storage"
      PORT: "3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      SEED_ADMIN_EMAIL: "admin@yerauksion.uz"
      SEED_ADMIN_PASSWORD: "admin123"
      SEED_OPERATOR_EMAIL: "operator@yerauksion.uz"
      SEED_OPERATOR_PASSWORD: "operator123"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    volumes:
      - dbdata:/app/data
      - storage:/app/storage

volumes:
  dbdata:
  storage:
